[project]
name = "fedbook-ml"
version = "0.1.0"
description = "FedBook-Sem ML recommender service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "neo4j==5.24.0",
    "httpx==0.27.2",
    "rapidfuzz==3.10.1",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "numpy==2.1.3",
    "lightfm==1.17",
    "scipy==1.14.1",
    "lightgbm==4.5.0",
    "joblib==1.4.2",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.32.0",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedbook_ml"]
