version: '3.9'

services:
  neo4j:
    image: neo4j:5.15
    container_name: fedbooksem-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/fedbooksem123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fedbooksem-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fedbooksem-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fedbooksem
      - POSTGRES_USER=fedbooksem
      - POSTGRES_PASSWORD=fedbooksem123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: fedbook-ml
    depends_on:
      - neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fedbooksem123
      OPENLIBRARY_USER_AGENT: "FedBook-Sem/0.1 (sanjaya.w@jinasena.com.lk)"
      PYTHONPATH: /app/src
    volumes:
      - ./ml-service:/app
      - ml_hf_cache:/root/.cache/huggingface
      - ml_torch_cache:/root/.cache/torch
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  ml_hf_cache:
  ml_torch_cache:
